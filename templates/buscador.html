<h2>Buscador</h2>

<section id="busqueda" class="panel">
  <h3>Búsqueda</h3>
  <form id="form-buscador">
    <input type="text" id="input-busqueda" autocomplete="off" placeholder="Buscar...">
    <button type="submit">Buscar</button>
  </form>
  <p id="estado-busqueda"></p>
</section>

<div class="buscador-contenido">

  <section id="resultados" class="panel">
    <h3>Resultados</h3>
    <div id="resultados-busqueda">
      <p>Realiza una búsqueda para ver resultados.</p>
    </div>
  </section>

  <div id="panel-seleccionado" class="panel">
    <h3>Item seleccionado</h3>
    <div id="detalle-item">
      <p>Selecciona un resultado para ver sus propiedades.</p>
    </div>
  </div>

</div>
